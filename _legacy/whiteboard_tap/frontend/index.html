<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; }
  #wb {
    width: 100%; display: block; touch-action: none;
    border: 2px dashed #7FB3B5; border-radius: 12px;
    background: #FFFFFF; cursor: crosshair;
  }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px;
         align-items: center; }
  .bar button {
    border-radius: 10px; border: 1px solid #C9DDE2; color: #2F4858;
    background: linear-gradient(135deg, #D6ECE9, #E3EBFB);
    font-weight: 600; padding: 6px 14px; cursor: pointer; font-size: 14px;
  }
  .bar button.active { outline: 2px solid #2F4858; }
  #stamp { background: linear-gradient(135deg, #FFE082, #FFCC80) !important;
           font-size: 15px; }
  .bar input[type=color] { width: 38px; height: 30px; padding: 0;
    border: 1px solid #C9DDE2; border-radius: 8px; }
  .bar input[type=range] { width: 110px; }
  #hint { font-size: 12px; color: #61707C; margin-top: 6px; }
</style>
</head>
<body>
<canvas id="wb"></canvas>
<div class="bar">
  <button id="bPen" class="active" onclick="setTool('pen')">Pen</button>
  <button id="bMark" onclick="setTool('marker')">Marker</button>
  <button id="bErase" onclick="setTool('eraser')">Eraser</button>
  <input type="color" id="wbc" value="#2D323C" title="colour">
  <input type="range" id="wbs" min="1" max="24" value="3" title="size">
  <button onclick="undo()">Undo</button>
  <button onclick="clearAll()">Clear</button>
  <button id="stamp" onclick="stamp()">Stamp into PDF</button>
</div>
<div id="hint">Draw with pen / stylus / touch / mouse — then hit Stamp.
Only stamping reruns the app.</div>

<script>
  var cv = document.getElementById('wb'),
      ctx = cv.getContext('2d'),
      drawing = false, tool = 'pen', hist = [],
      H = 420, sent = null;

  function onRender(e) {
    var h = (e.detail && e.detail.args && e.detail.args.height) || 420;
    H = h; fit(true);
    Streamlit.setFrameHeight(h + 110);
  }
  window.addEventListener('streamlit:render', onRender);
  window.addEventListener('load', function () { fit(true); });

  function fit(first) {
    var r = cv.getBoundingClientRect();
    var t = null;
    if (!first && cv.width > 0) {
      t = document.createElement('canvas');
      t.width = cv.width; t.height = cv.height;
      t.getContext('2d').drawImage(cv, 0, 0);
    }
    cv.width = Math.max(300, r.width * 2);
    cv.height = H * 2;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0, 0, cv.width, cv.height);
    if (t) ctx.drawImage(t, 0, 0, cv.width, cv.height);
  }
  window.addEventListener('resize', function () { fit(false); });

  function push() {
    hist.push(cv.toDataURL('image/png'));
    if (hist.length > 40) hist.shift();
  }
  push();

  function pos(e) {
    var r = cv.getBoundingClientRect();
    if (e.touches && e.touches[0]) {
      return [(e.touches[0].clientX - r.left) * 2,
              (e.touches[0].clientY - r.top) * 2];
    }
    return [(e.clientX - r.left) * 2, (e.clientY - r.top) * 2];
  }
  function setTool(t) {
    tool = t;
    document.getElementById('bPen').className = t === 'pen' ? 'active' : '';
    document.getElementById('bMark').className = t === 'marker' ? 'active' : '';
    document.getElementById('bErase').className = t === 'eraser' ? 'active' : '';
  }
  function undo() {
    if (hist.length > 1) {
      hist.pop();
      var i = new Image();
      i.onload = function () {
        ctx.clearRect(0, 0, cv.width, cv.height);
        ctx.drawImage(i, 0, 0);
      };
      i.src = hist[hist.length - 1];
      sent = null;
    }
  }
  function clearAll() {
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0, 0, cv.width, cv.height);
    push(); sent = null;
  }
  function isBlank() {
    var t = document.createElement('canvas');
    t.width = 32; t.height = 16;
    var c = t.getContext('2d');
    c.drawImage(cv, 0, 0, 32, 16);
    var d = c.getImageData(0, 0, 32, 16).data;
    for (var i = 0; i < d.length; i += 4) {
      if (d[i] < 250 || d[i + 1] < 250 || d[i + 2] < 250) return false;
    }
    return true;
  }
  function stamp() {
    if (isBlank()) { alert('Draw something first!'); return; }
    var url = cv.toDataURL('image/png');
    if (url !== sent) { sent = url; Streamlit.setComponentValue(url); }
  }

  cv.addEventListener('pointerdown', function (e) {
    drawing = true;
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    var p = pos(e);
    ctx.beginPath(); ctx.moveTo(p[0], p[1]);
    e.preventDefault();
  });
  cv.addEventListener('pointermove', function (e) {
    if (!drawing) return;
    var p = pos(e);
    var w = parseFloat(document.getElementById('wbs').value);
    if (e.pointerType === 'pen' && e.pressure && e.pressure > 0) {
      w = Math.max(1, w * e.pressure * 1.6);
    }
    ctx.lineWidth = w * 2;
    if (tool === 'eraser') {
      ctx.globalCompositeOperation = 'destination-out';
      ctx.strokeStyle = 'rgba(0,0,0,1)';
    } else {
      ctx.globalCompositeOperation = 'source-over';
      ctx.strokeStyle = document.getElementById('wbc').value;
      ctx.globalAlpha = (tool === 'marker') ? 0.45 : 1.0;
    }
    ctx.lineTo(p[0], p[1]); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(p[0], p[1]);
    e.preventDefault();
  });
  function stop() {
    if (drawing) {
      drawing = false; ctx.globalAlpha = 1.0;
      ctx.globalCompositeOperation = 'source-over';
      push(); sent = null;
    }
  }
  cv.addEventListener('pointerup', stop);
  cv.addEventListener('pointercancel', stop);
  cv.addEventListener('touchmove', function (e) { e.preventDefault(); },
                      { passive: false });

  if (window.Streamlit) { Streamlit.setFrameHeight(H + 110); }
</script>
</body>
</html>
